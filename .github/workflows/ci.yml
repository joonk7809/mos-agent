name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: scripts/check.sh   # ruff + mypy + pytest (incl. Hypothesis property tests)

  pager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/*.test.js

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The bridge builds against the public SDK for the emulator quick path; the digest is a dummy.
      - run: ./gradlew --no-daemon :core:test :app:assembleDebug :bridge:assembleRelease -Pmos.appCertSha256=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - uses: actions/upload-artifact@v4
        with:
          name: mos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
